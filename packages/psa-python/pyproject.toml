[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "password-security-analyzer"
version = "0.1.0"
description = "Advisory password strength analyzer (native FFI → psa-ffi). Does not authorize accounts."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Password Security Analyzer Contributors" }]
keywords = ["password", "security", "strength", "advisory", "hibp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
[project.urls]
Homepage = "https://github.com/erendemirel/password-security-analyzer"
Repository = "https://github.com/erendemirel/password-security-analyzer"
Documentation = "https://github.com/erendemirel/password-security-analyzer#readme"
Issues = "https://github.com/erendemirel/password-security-analyzer/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["password_security_analyzer*"]

[tool.setuptools.package-data]
password_security_analyzer = ["lib/*"]
