[package]
name = "psa-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Advisory password strength analysis: HIBP, Markov, Monte Carlo"
readme = "../../README.md"

[features]
default = ["native-http", "embedded-model"]
# Blocking HTTP client for Have I Been Pwned (native targets).
native-http = ["dep:reqwest"]
# Embed models/markov4.bin + mc_curve.bin + known.bin at compile time.
# Disable for HIBP + keyspace-bits-only builds with no training artifacts.
embedded-model = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha1 = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
