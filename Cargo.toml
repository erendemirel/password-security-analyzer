[workspace]
resolver = "2"
members = [
    "crates/psa-core",
    "crates/psa-cli",
    "crates/psa-wasm",
    "crates/psa-ffi",
]
default-members = ["crates/psa-core", "crates/psa-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/example/password-security-analyzer"
authors = ["Password Security Analyzer Contributors"]

[workspace.dependencies]
psa-core = { path = "crates/psa-core", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha1 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
clap = { version = "4", features = ["derive"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Request", "RequestInit", "RequestMode", "Headers", "Response"] }
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] }
serde-wasm-bindgen = "0.6"
